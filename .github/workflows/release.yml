# Creates a GitHub release (and so a Zenodo DOI version) when a commit on main
# has [release] in its message. Version comes from CITATION.cff, notes from RELEASE_NOTES.md.
name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(grep '^version:' CITATION.cff | sed 's/version: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/')
          if gh release view "v$V" >/dev/null 2>&1; then echo "v$V already released"; exit 0; fi
          gh release create "v$V" --target "$GITHUB_SHA" --title "StrokeSmriti v$V" --notes-file RELEASE_NOTES.md
