name: Build Android app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Check Android SDK (preinstalled on the runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3
      - run: npm ci
      - run: ./prepare_www.sh
      - run: npx cap sync android
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed bundle and APK
        working-directory: android-app/android
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew --no-daemon bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: strokesmriti-android
          path: |
            android-app/android/app/build/outputs/bundle/release/*.aab
            android-app/android/app/build/outputs/apk/release/*.apk
